<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق الفاتورة - تسجيل الدخول</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Cairo', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .mobile-container {
            width: 100%;
            max-width: 400px;
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                transform: translateY(30px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 30px 30px;
            text-align: center;
        }

        .app-icon {
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }

        .app-name {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .app-subtitle {
            font-size: 14px;
            opacity: 0.9;
        }

        .content {
            padding: 40px 30px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        input[type="text"],
        input[type="password"],
        input[type="email"] {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        input[type="text"]:focus,
        input[type="password"]:focus,
        input[type="email"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        input::placeholder {
            color: #999;
        }

        .password-toggle {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: #667eea;
            font-size: 18px;
            padding: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        .remember-me {
            display: flex;
            align-items: center;
            margin-bottom: 24px;
            gap: 8px;
        }

        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #667eea;
        }

        .remember-me label {
            margin: 0;
            font-weight: 500;
            color: #666;
            cursor: pointer;
        }

        .login-button {
            width: 100%;
            padding: 14px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 16px;
        }

        .login-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .login-button:active {
            transform: translateY(0);
        }

        .login-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .footer-text {
            text-align: center;
            color: #666;
            font-size: 13px;
            margin-top: 20px;
        }

        .footer-link {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
        }

        .footer-link:hover {
            text-decoration: underline;
        }

        .error-message {
            background: #fee;
            border-left: 4px solid #f55;
            color: #c33;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 13px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .demo-info {
            background: #f0f4ff;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 12px;
            color: #667eea;
            margin-bottom: 20px;
            text-align: center;
        }

        @media (max-width: 480px) {
            .mobile-container {
                border-radius: 16px;
            }

            .content {
                padding: 30px 20px;
            }

            .header {
                padding: 30px 20px 25px;
            }

            .app-name {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="mobile-container">
        <div class="header">
            <div class="app-icon">📱</div>
            <div class="app-name">تطبيق الفاتورة</div>
            <div class="app-subtitle">إدارة الديون والمدفوعات</div>
        </div>

        <div class="content">
            <div class="demo-info">
                اختبر بأي بيانات - لا يوجد تحقق من الخادم
            </div>

            <div id="errorMessage" class="error-message"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">البريد الإلكتروني أو اسم المستخدم</label>
                    <input 
                        type="text" 
                        id="email" 
                        placeholder="أدخل بريدك الإلكتروني"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">كلمة المرور</label>
                    <div class="input-wrapper">
                        <input 
                            type="password" 
                            id="password" 
                            placeholder="أدخل كلمة المرور"
                            required
                        >
                        <button 
                            type="button" 
                            class="password-toggle" 
                            id="togglePassword"
                            title="إظهار/إخفاء كلمة المرور"
                        >
                            👁
                        </button>
                    </div>
                </div>

                <div class="remember-me">
                    <input type="checkbox" id="rememberMe">
                    <label for="rememberMe">تذكرني</label>
                </div>

                <button type="submit" class="login-button" id="loginButton">
                    تسجيل الدخول
                </button>
            </form>

            <div class="footer-text">
                ليس لديك حساب؟ 
                <span class="footer-link" id="signupLink">
                    إنشاء حساب جديد
                </span>
            </div>
        </div>
    </div>

    <script>
        // Handle password toggle
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');

        togglePassword.addEventListener('click', () => {
            const isPassword = passwordInput.type === 'password';
            passwordInput.type = isPassword ? 'text' : 'password';
            togglePassword.textContent = isPassword ? '🙈' : '👁';
        });

        // Handle login form
        const loginForm = document.getElementById('loginForm');
        const loginButton = document.getElementById('loginButton');
        const errorMessage = document.getElementById('errorMessage');
        const emailInput = document.getElementById('email');
        const passwordInput2 = document.getElementById('password');

        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();

            const email = emailInput.value.trim();
            const password = passwordInput2.value;

            // Validation
            if (!email) {
                showError('يرجى إدخال البريد الإلكتروني');
                return;
            }

            if (!password) {
                showError('يرجى إدخال كلمة المرور');
                return;
            }

            if (password.length < 6) {
                showError('كلمة المرور يجب أن تكون 6 أحرف على الأقل');
                return;
            }

            // Show loading state
            const originalText = loginButton.textContent;
            loginButton.disabled = true;
            loginButton.innerHTML = '<span class="loading-spinner"></span>جاري التحميل...';

            // Simulate login delay
            setTimeout(() => {
                // Local storage success
                localStorage.setItem('pos_user', JSON.stringify({
                    email: email,
                    rememberMe: document.getElementById('rememberMe').checked,
                    loginTime: new Date().toISOString()
                }));

                // Success message
                errorMessage.classList.remove('show');
                loginButton.innerHTML = '✓ تم تسجيل الدخول بنجاح';
                loginButton.style.backgroundColor = '#4caf50';

                // Redirect after delay
                setTimeout(() => {
                    window.location.href = './dashboard.html';
                }, 1500);
            }, 1000);
        });

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add('show');
            setTimeout(() => {
                errorMessage.classList.remove('show');
            }, 4000);
        }

        // Handle signup link
        document.getElementById('signupLink').addEventListener('click', () => {
            alert('سيتم إضافة صفحة التسجيل قريباً');
        });

        // Auto-fill for demo purposes
        window.addEventListener('load', () => {
            emailInput.value = 'demo@example.com';
            passwordInput2.value = 'demo123456';
            document.getElementById('rememberMe').checked = true;
        });
    </script>
</body>
</html>
